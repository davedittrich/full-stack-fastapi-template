[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.114.2",
    "python-multipart<1.0.0,>=0.0.7",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "passlib[bcrypt]<2.0.0,>=1.7.4",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>2.0",
    "emails<1.0,>=0.6",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "sqlmodel<1.0.0,>=0.0.21",
    # Pin bcrypt until passlib supports the latest
    "bcrypt==4.3.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]<2.0.0,>=1.40.6",
    "pyjwt<3.0.0,>=2.8.0",
    # CLI dependencies
    "cliff<5.0.0,>=4.5.0",
    "python-secrets<25.0.0,>=24.10.12",
    "requests<3.0.0,>=2.31.0",
]

[tool.uv]
dev-dependencies = [
    "pytest<8.0.0,>=7.4.3",
    "mypy<2.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "pre-commit<4.0.0,>=3.6.2",
    "types-passlib<2.0.0.0,>=1.7.7.20240106",
    "coverage<8.0.0,>=7.4.3",
]

[project.scripts]
tanzanite = "app.cli.__main__:main"

[project.entry-points."tanzanite"]
# Challenge commands
"challenge_create" = "app.cli.challenge.create:CmdChallengeCreate"
"challenge_delete" = "app.cli.challenge.delete:CmdChallengeDelete"
"challenge_export" = "app.cli.challenge.export:CmdChallengeExport"
"challenge_import" = "app.cli.challenge.import:CmdChallengeImport"
"challenge_list" = "app.cli.challenge.list:CmdChallengeList"
"challenge_show" = "app.cli.challenge.show:CmdChallengeShow"
"challenge_update" = "app.cli.challenge.update:CmdChallengeUpdate"

# Question commands
"question_create" = "app.cli.question.create:CmdQuestionCreate"
"question_delete" = "app.cli.question.delete:CmdQuestionDelete"
"question_list" = "app.cli.question.list:CmdQuestionList"
"question_show" = "app.cli.question.show:CmdQuestionShow"
"question_update" = "app.cli.question.update:CmdQuestionUpdate"

# User commands
"user_create" = "app.cli.user.create:CmdUserCreate"
"user_delete" = "app.cli.user.delete:CmdUserDelete"
"user_list" = "app.cli.user.list:CmdUserList"
"user_show" = "app.cli.user.show:CmdUserShow"
"user_update" = "app.cli.user.update:CmdUserUpdate"

# Server commands
"server_start" = "app.cli.server.start:CmdServerStart"
"server_stop" = "app.cli.server.stop:CmdServerStop"

# Database commands
"db_init" = "app.cli.db.init:CmdDbInit"
"db_reset" = "app.cli.db.reset:CmdDbReset"

# Utility commands
"login" = "app.cli.login:CmdLogin"
"about" = "app.cli.about:CmdAbout"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true
